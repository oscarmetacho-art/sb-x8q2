<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponle botox a Shei</title>
<style>
  html,body{margin:0;height:100%;background:#1a0a1f;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// ---------- Configuración ----------
const IMG_W = 875, IMG_H = 1798;      // tamaño de la foto (coordenadas del juego)
const WS = 0.75;                      // escala de la foto de trabajo
const TURN_SECONDS = 20;

// Cada zona tiene sus archivos assets/after_<n>.jpg y assets/mask_<n>.png (ver prepare_assets.py)
const ZONES = [
  { n: 'labios',   t: 'Labios',   grow: 1,    msg: '¡Labios de pato nivel experto!' },
  { n: 'nariz',    t: 'Nariz',    grow: 1,    msg: '¡Nariz de payaso!' },
  { n: 'parpados', t: 'Párpados', grow: 1,    msg: '¡Ojos de muñeca!' },
  { n: 'pomulos',  t: 'Pómulos',  grow: 1,    msg: '¡Pómulos de silicona!' },
  { n: 'barbilla', t: 'Barbilla', grow: 1,    msg: '¡Mentón de villano de caricatura!' },
  { n: 'cuello',   t: 'Cuello',   grow: 0.4,  msg: '¡Cuello de jirafa!' },
];
// Orden de capas (el número más alto queda encima, sin importar en qué orden se pinchen)
const PRIO = { cuello: 1, barbilla: 2, pomulos: 3, parpados: 4, nariz: 5, labios: 6 };
// Zonas que se cruzan demasiado entre sí: si una está tuneada, la otra ya no se puede
const CONFLICT = { pomulos: ['parpados'], parpados: ['pomulos'], barbilla: ['cuello'], cuello: ['barbilla'] };
ZONES.forEach(z => { z.prio = PRIO[z.n]; });

// Retos para el que pierde. shot: si no lo cumple, toma un shot. secs: tiempo del cronómetro.
// kind 'q' = pregunta sobre la cumpleañera (la responde el perdedor; si falla, shot).
const CHALL_SECONDS = 30;
const mk = (t, extra) => Object.assign({ t, shot: true, secs: CHALL_SECONDS, kind: 'r' }, extra);
const CHALLENGES = [
  mk('Quítale un calcetín a alguien'),
  mk('Baila bachata con alguien que elijan los demás'),
  mk('FONDO BLANCO', { shot: false }),
  mk('Dale un abrazo de 30 segundos a un desconocido'),
  mk('Carga a otro invitado durante 10 segundos'),
  mk('10 sentadillas'),
  mk('Modela tu outfit por la pasarela'),
  mk('Intercambia los zapatos con la persona que elijan los demás'),
  mk('Quédate sobre un solo pie'),
  mk('Encuentra algo de comer y cómetelo'),
  mk('Encuentra a alguien con una prenda azul'),
  mk('Encuentra a alguien con una prenda verde'),
  mk('Encuentra a alguien con una prenda amarilla'),
  mk('Debes subirte a tuta a alguien por 10 segundos'),
  mk('Sal, toca el timbre y vuelve'),
  mk('Encuentra en la casa un objeto que tenga verde'),
  mk('Encuentra en la casa un objeto que tenga azul'),
  mk('Encuentra en la casa un objeto que tenga negro'),
  mk('Encuentra en la casa un objeto que tenga pelos'),
  mk('¿Cuál es su comida favorita?', { kind: 'q', secs: 20 }),
  mk('¿Cómo se llamó su primer colegio?', { kind: 'q', secs: 20 }),
  mk('¿Cuándo compró su moto?', { kind: 'q', secs: 20 }),
  mk('¿Cuál fue su primer novio?', { kind: 'q', secs: 20 }),
  mk('¿Cuándo se graduó de la universidad?', { kind: 'q', secs: 20 }),
  mk('¿Cuál país fue su primer viaje internacional?', { kind: 'q', secs: 20 }),
];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W, H, S, PX, PY, u;
function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  W = cv.width; H = cv.height; u = H / 1080;
  S = (H - 24 * u) / IMG_H;
  if (IMG_W * S > W * 0.5) S = (W * 0.5) / IMG_W;
  PX = (W - IMG_W * S) / 2; PY = (H - IMG_H * S) / 2;
}
addEventListener('resize', resize); resize();

// ---------- Carga de imágenes ----------
const baseImg = new Image();
const wc = document.createElement('canvas'); wc.width = Math.round(IMG_W * WS); wc.height = Math.round(IMG_H * WS);
const wctx = wc.getContext('2d');
let appliedList = [];
let pending = 1 + ZONES.length * 2;
function oneLoaded() { if (--pending === 0) buildZones(); }
baseImg.onload = oneLoaded; baseImg.onerror = oneLoaded; baseImg.src = 'assets/base.jpg';
ZONES.forEach(z => {
  z.after = new Image(); z.mask = new Image();
  z.after.onload = z.after.onerror = oneLoaded; z.mask.onload = z.mask.onerror = oneLoaded;
  z.after.src = 'assets/after_' + z.n + '.jpg'; z.mask.src = 'assets/mask_' + z.n + '.png';
});

// Por cada zona: mapa de impacto (canal G), capa lista para mezclar (after recortada con el canal B) y su centro
function buildZones() {
  const mc = document.createElement('canvas'); mc.width = IMG_W; mc.height = IMG_H;
  const mx = mc.getContext('2d');
  const ac = document.createElement('canvas'); ac.width = IMG_W; ac.height = IMG_H;
  const ax = ac.getContext('2d');
  ZONES.forEach(z => {
    mx.clearRect(0, 0, IMG_W, IMG_H); mx.drawImage(z.mask, 0, 0, IMG_W, IMG_H);
    const d = mx.getImageData(0, 0, IMG_W, IMG_H).data;
    const out = ax.createImageData(IMG_W, IMG_H);
    z.hit = new Uint8Array(IMG_W * IMG_H); z.area = 0; let sxs = 0, sys = 0;
    for (let i = 0, p = 0; i < z.hit.length; i++, p += 4) {
      out.data[p + 3] = d[p + 2];                        // alpha de mezcla = canal B
      if (d[p + 1] > 127) {                              // zona de impacto = canal G
        z.hit[i] = 1; z.area++; sxs += i % IMG_W; sys += (i / IMG_W) | 0;
      }
    }
    z.cx = z.area ? sxs / z.area : IMG_W / 2; z.cy = z.area ? sys / z.area : IMG_H / 2;
    ax.putImageData(out, 0, 0);
    z.alphaC = document.createElement('canvas'); z.alphaC.width = wc.width; z.alphaC.height = wc.height;
    z.alphaC.getContext('2d').drawImage(ac, 0, 0, wc.width, wc.height);
    z.layer = document.createElement('canvas'); z.layer.width = wc.width; z.layer.height = wc.height;
    const lx = z.layer.getContext('2d');
    lx.drawImage(z.after, 0, 0, wc.width, wc.height);
    lx.globalCompositeOperation = 'destination-in';
    lx.drawImage(ac, 0, 0, wc.width, wc.height);
  });
  resetWork(); st = 'home';
}

// Zonas que cubren el punto (de la más chica a la más grande)
function hitsAt(x, y) {
  const ix = Math.round(x), iy = Math.round(y);
  if (ix < 0 || iy < 0 || ix >= IMG_W || iy >= IMG_H) return [];
  const at = (px, py) => {
    if (px < 0 || py < 0 || px >= IMG_W || py >= IMG_H) return [];
    return ZONES.filter(z => z.hit && z.hit[py * IMG_W + px]);
  };
  let hits = at(ix, iy);
  for (const r of [14, 28, 42]) {            // el círculo del control no es tan preciso: se busca alrededor
    for (let a = 0; a < 8 && !hits.length; a++) hits = at(Math.round(ix + r * Math.cos(a * Math.PI / 4)), Math.round(iy + r * Math.sin(a * Math.PI / 4)));
    if (hits.length) break;
  }
  return hits.sort((a, b) => a.area - b.area);
}
// Si la zona no se puede tunear ahora, devuelve la zona ya aplicada que la bloquea
function blockedBy(z) {
  if (appliedList.includes(z)) return z;
  return appliedList.find(a => (CONFLICT[z.n] || []).includes(a.n)) || null;
}

// ---------- Foto de trabajo (acumula los cambios) ----------
let blend = null;
function resetWork() {
  wctx.globalAlpha = 1; wctx.drawImage(baseImg, 0, 0, wc.width, wc.height); blend = null;
  appliedList = [];
}
// La foto se arma siempre igual: original + capas por orden de prioridad (no depende de qué se pinchó primero)
function beginBlend(z) {
  const sorted = appliedList.slice().sort((a, b) => a.prio - b.prio);
  const under = document.createElement('canvas'); under.width = wc.width; under.height = wc.height;
  const ux = under.getContext('2d');
  ux.drawImage(baseImg, 0, 0, wc.width, wc.height);
  sorted.filter(a => a.prio < z.prio).forEach(a => ux.drawImage(a.layer, 0, 0));
  const over = sorted.filter(a => a.prio > z.prio);
  appliedList.push(z);
  blend = { z, under, over, cx: z.cx * WS, cy: z.cy * WS };
}
// La zona crece desde algo más chica, se pasa de tamaño (rebote) y se asienta
function stepBlend(p) {
  const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x * x * (3 - 2 * x);
  let sc = p < 0.6 ? 0.8 + 0.32 * eo(p / 0.6) : 1.12 - 0.12 * eio((p - 0.6) / 0.4);
  sc = 1 + (sc - 1) * blend.z.grow;
  wctx.globalAlpha = 1; wctx.drawImage(blend.under, 0, 0);
  wctx.save(); wctx.globalAlpha = Math.min(1, p / 0.3);
  wctx.translate(blend.cx, blend.cy); wctx.scale(sc, sc); wctx.translate(-blend.cx, -blend.cy);
  wctx.drawImage(blend.z.layer, 0, 0); wctx.restore(); wctx.globalAlpha = 1;
  blend.over.forEach(a => wctx.drawImage(a.layer, 0, 0));
}

// ---------- Estado ----------
let st = 'loading';        // loading | home | aim | reveal | lose
let attempt = 1;
let cursor = { x: IMG_W / 2, y: IMG_H * 0.4 }, holdT = 0, timeLeft = TURN_SECONDS;
let result = null, revealT = 0, t = 0, lastKeyOk = 0, lastPoint = null;
let loseWhy = 'out';
let chall = null, lastChall = null, cPhase = 'ready', cDone = 'ok', challT = CHALL_SECONDS, deck = [];
const held = { L: false, R: false, U: false, D: false };

// ---------- Sonido ----------
// Se generan archivos WAV al cargar y se reproducen con <audio>: funciona en más navegadores de TV
// que el audio sintetizado en vivo (Web Audio), que muchos bloquean.
// Cada nota: [frecuencia inicial, final, duración, forma, volumen, retraso]
const NOTES = {
  pop:     [[700, 120, 0.25, 'triangle', 0.5, 0]],
  inflate: [[180, 900, 0.55, 'sine', 0.4, 0], [900, 250, 0.2, 'triangle', 0.3, 0.55]],
  win:     [523, 659, 784, 1047].map((f, i) => [f, f, 0.18, 'square', 0.25, i * 0.12]),
  meh:     [[300, 150, 0.4, 'sawtooth', 0.25, 0]],
  lose:    [392, 349, 294, 196].map((f, i) => [f, f * 0.97, 0.3, 'sawtooth', 0.3, i * 0.28]),
  tick:    [[900, 900, 0.05, 'square', 0.15, 0]],
  start:   [[440, 440, 0.12, 'square', 0.25, 0], [880, 880, 0.25, 'square', 0.25, 0.14]],
  buzz:    [[150, 80, 0.7, 'sawtooth', 0.45, 0], [150, 80, 0.7, 'square', 0.25, 0.8]],
  reveal:  [[300, 200, 0.5, 'sawtooth', 0.3, 0], [150, 600, 0.6, 'triangle', 0.35, 0.4]],
};
const wavUrls = {};
function makeWav(notes) {
  const SR = 22050;
  const total = Math.max(...notes.map(n => n[5] + n[2])) + 0.05;
  const N = Math.ceil(total * SR), mix = new Float32Array(N);
  notes.forEach(([f1, f2, dur, type, vol, delay]) => {
    let ph = 0;
    for (let i = 0; i < N; i++) {
      const tt = i / SR - delay; if (tt < 0 || tt > dur) continue;
      const f = f1 * Math.pow(f2 / f1, tt / dur);
      ph += 2 * Math.PI * f / SR;
      const c = ph % (2 * Math.PI), x = c / (2 * Math.PI);
      const w = type === 'square' ? (c < Math.PI ? 1 : -1) : type === 'sawtooth' ? 2 * x - 1
              : type === 'triangle' ? 4 * Math.abs(x - 0.5) - 1 : Math.sin(c);
      mix[i] += w * vol * Math.pow(0.0001 / vol, tt / dur);
    }
  });
  const buf = new ArrayBuffer(44 + N * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + N * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, N * 2, true);
  for (let i = 0; i < N; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, mix[i])) * 32767, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function buildSounds() { for (const k in NOTES) wavUrls[k] = makeWav(NOTES[k]); }
function play(name) {
  try {
    if (!wavUrls[name]) return;
    const a = new Audio(wavUrls[name]); a.volume = 1;
    const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}
const sndPop = () => play('pop'), sndWin = () => play('win'), sndMeh = () => play('meh');
const sndLose = () => play('lose'), sndTick = () => play('tick'), sndStart = () => play('start');
const sndInflate = () => play('inflate'), sndBuzz = () => play('buzz'), sndReveal = () => play('reveal');
buildSounds();

// ---------- Lógica ----------
function startAim() {
  lastPoint = null; cursor = { x: IMG_W / 2, y: IMG_H * 0.4 }; holdT = 0; timeLeft = TURN_SECONDS;
  st = 'aim'; sndStart();
}

function lose(reason, why) {
  result = { zone: null, msg: reason }; revealT = 0; loseWhy = why;
  st = 'lose'; sndLose();
}
// Azar bueno (Fisher-Yates + crypto): el sort con Math.random() sale muy sesgado en algunos navegadores de TV
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
function startChallenge() {
  if (!deck.length) {
    deck = shuffle(CHALLENGES.slice());
    if (deck.length > 1 && deck[deck.length - 1] === lastChall) deck.unshift(deck.pop());   // no repetir el último
  }
  chall = lastChall = deck.pop(); cPhase = 'ready'; st = 'chall'; sndReveal();
  resetWork(); attempt = 1;     // el juego se reinicia
}

function inject(outside) {
  if (outside) { lose('Hiciste clic fuera de la foto.', 'out'); return; }
  const hits = hitsAt(cursor.x, cursor.y);
  // pelo, frente, fondo o cualquier parte sin botox: pierdes
  if (!hits.length) { lose('Eso no era una zona de botox: le diste al pelo, al fondo o a la piel sin tunear.', 'miss'); return; }
  const z = hits.find(h => !blockedBy(h));
  revealT = 0; st = 'reveal';
  if (!z) {
    const b = blockedBy(hits[0]);
    result = { zone: null, msg: b === hits[0] ? 'Esa zona ya estaba tuneada. ¡Elige otra!'
      : 'Eso se cruza con ' + b.t.toLowerCase() + ', que ya estaba tuneado. ¡Elige otra!' };
    sndMeh(); return;
  }
  result = { zone: z, msg: z.msg };
  beginBlend(z); sndPop(); sndInflate(); sndWin();
}

function ok() {
  if (st === 'home') startAim();
  else if (st === 'aim') inject(false);
  else if (st === 'reveal') { attempt++; st = 'home'; }
  else if (st === 'lose') { if (revealT > 0.5) startChallenge(); }
  else if (st === 'chall') {
    if (cPhase === 'ready') { cPhase = 'run'; challT = chall.secs; sndStart(); }
    else if (cPhase === 'run') { cPhase = 'done'; cDone = 'ok'; sndWin(); }
    else st = 'home';
  }
}
function restartGame() {
  if (st === 'loading') return;
  resetWork(); attempt = 1; st = 'home';
}
const back = restartGame;
// Botón permanente en la esquina superior derecha
const restartBtn = () => ({ x: W - 300 * u, y: 20 * u, w: 280 * u, h: 64 * u });

// ---------- Entrada: control remoto (flechas + OK) y puntero (círculo del control, mouse, touch) ----------
function keyOf(e) {
  const c = e.keyCode, k = e.key;
  if (k === 'ArrowLeft'  || c === 37 || c === 21) return 'L';
  if (k === 'ArrowUp'    || c === 38 || c === 19) return 'U';
  if (k === 'ArrowRight' || c === 39 || c === 22) return 'R';
  if (k === 'ArrowDown'  || c === 40 || c === 20) return 'D';
  if (k === 'Enter' || k === ' ' || c === 13 || c === 23 || c === 66 || c === 32) return 'OK';
  if (k === 'Escape' || k === 'Backspace' || c === 27 || c === 8 || c === 4) return 'BACK';
  return null;
}
addEventListener('keydown', e => {
  const k = keyOf(e); if (!k) return;
  e.preventDefault();
  if (k === 'OK') { if (!e.repeat) { lastKeyOk = performance.now(); ok(); } return; }
  if (k === 'BACK') { if (!e.repeat) back(); return; }
  held[k] = true;
});
addEventListener('keyup', e => { const k = keyOf(e); if (k && held[k] !== undefined) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });

function pointOf(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (cv.width / r.width), cy = (e.clientY - r.top) * (cv.height / r.height);
  const x = (cx - PX) / S, y = (cy - PY) / S;
  return { x, y, out: x < 0 || y < 0 || x > IMG_W || y > IMG_H, t: performance.now() };
}
function pointTo(e) {
  const p = pointOf(e); lastPoint = p;
  cursor.x = Math.min(IMG_W, Math.max(0, p.x)); cursor.y = Math.min(IMG_H, Math.max(0, p.y));
  return p;
}
['mousemove', 'pointermove', 'mousedown', 'pointerdown', 'mouseover'].forEach(n =>
  cv.addEventListener(n, e => { if (st === 'aim') pointTo(e); }));
cv.addEventListener('click', e => {
  if (performance.now() - lastKeyOk < 400) return;
  {
    const r = cv.getBoundingClientRect(), b = restartBtn();
    const px = (e.clientX - r.left) * (cv.width / r.width), py = (e.clientY - r.top) * (cv.height / r.height);
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) { restartGame(); return; }
  }
  if (st === 'lose') { if (revealT > 0.5) startChallenge(); return; }
  if (st === 'aim') {
    // si el puntero ya nos dijo dónde está hace poco, ese dato manda; si no, usamos las coordenadas del clic
    const p = (lastPoint && performance.now() - lastPoint.t < 1500) ? lastPoint : pointTo(e);
    cursor.x = Math.min(IMG_W, Math.max(0, p.x)); cursor.y = Math.min(IMG_H, Math.max(0, p.y));
    inject(p.out);
    return;
  }
  ok();
});

// ---------- Dibujo ----------
const sx = x => PX + x * S, sy = y => PY + y * S;

function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(txt, x, y, maxW, lh) {
  const words = txt.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; }
    else line = test;
  }
  ctx.fillText(line, x, y); return y + lh;
}
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 'bold') + ' ' + Math.round(size * u) + 'px Arial,Helvetica,sans-serif';
  ctx.fillStyle = color || '#fff'; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y);
}
function banner(s, cx, cy, size, fill, stroke, rot) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot || 0);
  ctx.font = 'bold ' + Math.round(size) + 'px Arial'; ctx.textAlign = 'center';
  ctx.lineWidth = 10 * u; ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.strokeText(s, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(s, 0, 0); ctx.restore();
}

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#2a0a33'); g.addColorStop(1, '#0d1b3a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawPhoto() {
  ctx.save();
  rrect(PX - 6 * u, PY - 6 * u, IMG_W * S + 12 * u, IMG_H * S + 12 * u, 18 * u);
  ctx.fillStyle = st === 'lose' ? '#ff2d2d' : '#ff4fa3'; ctx.fill(); ctx.restore();
  ctx.save(); rrect(PX, PY, IMG_W * S, IMG_H * S, 12 * u); ctx.clip();
  if (st !== 'loading') ctx.drawImage(wc, PX, PY, IMG_W * S, IMG_H * S);
  else { ctx.fillStyle = '#444'; ctx.fillRect(PX, PY, IMG_W * S, IMG_H * S); }
  ctx.restore();
}

function drawSyringe(x, y, k) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 4); ctx.scale(k, k);
  ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(70, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(70, -14, 130, 28);
  ctx.fillStyle = '#ff4fa3'; ctx.fillRect(74, -10, 90, 20);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(70, -14, 130, 28);
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(90 + i * 22, -14); ctx.lineTo(90 + i * 22, -6); ctx.stroke(); }
  ctx.fillStyle = '#eee'; ctx.fillRect(198, -26, 8, 52); ctx.strokeRect(198, -26, 8, 52);
  ctx.fillStyle = '#bbb'; ctx.fillRect(206, -5, 70, 10);
  ctx.fillStyle = '#eee'; ctx.fillRect(274, -18, 9, 36); ctx.strokeRect(274, -18, 9, 36);
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, 5 * u, 0, 7); ctx.fillStyle = '#ff2d2d'; ctx.fill();
}
const syringeK = () => u * 0.85 * (S / 0.66);

function drawLeft() {
  const x = 30 * u, w = PX - 60 * u;
  text('PONLE BOTOX', x + w / 2, 110 * u, 54, '#ff7ac0', 'center');
  text('A SHEI', x + w / 2, 175 * u, 70, '#fff', 'center');
  if (st === 'loading') return;
  text('Intento ' + attempt, x, 300 * u, 40, '#ffd24d');
}

function drawRestart() {
  const b = restartBtn();
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; rrect(b.x, b.y, b.w, b.h, 18 * u); ctx.fill();
  ctx.lineWidth = 3 * u; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; rrect(b.x, b.y, b.w, b.h, 18 * u); ctx.stroke();
  text('REINICIAR', b.x + b.w / 2, b.y + b.h / 2 + 11 * u, 30, '#fff', 'center');
}

function drawRight() {
  const x = PX + IMG_W * S + 30 * u, w = W - x - 30 * u;
  ctx.textAlign = 'left';
  if (st === 'aim') {
    text('¡Ahora!', x, 200 * u, 56, '#fff');
    ctx.font = Math.round(32 * u) + 'px Arial'; ctx.fillStyle = '#e8dff0';
    wrap('Mueve el círculo y haz clic para inyectar.', x, 270 * u, w, 44 * u);
    ctx.fillStyle = '#ff8a8a';
    wrap('Si haces clic fuera de la foto o en el pelo, la frente o el fondo, pierdes.', x, 400 * u, w, 44 * u);
    const frac = Math.max(0, timeLeft / TURN_SECONDS);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; rrect(x, 540 * u, w, 36 * u, 18 * u); ctx.fill();
    ctx.fillStyle = frac > 0.3 ? '#4cd964' : '#ff453a'; rrect(x, 540 * u, Math.max(w * frac, 30 * u), 36 * u, 18 * u); ctx.fill();
    text(Math.ceil(timeLeft) + ' s', x + w / 2, 640 * u, 64, frac > 0.3 ? '#fff' : '#ff6b6b', 'center');
  } else if (st === 'reveal') {
    text(result.zone ? result.zone.t : 'Sin efecto', x, 200 * u, 48, '#ffd24d');
    ctx.font = Math.round(40 * u) + 'px Arial'; ctx.fillStyle = '#fff';
    const y = wrap(result.msg, x, 290 * u, w, 54 * u);
    text('Clic: siguiente intento', x, y + 60 * u, 32, '#ff7ac0');
  } else if (st === 'lose') {
    ctx.font = Math.round(40 * u) + 'px Arial'; ctx.fillStyle = '#ffb3b3';
    const y = wrap(result.msg, x, 290 * u, w, 54 * u);
    const pulse = 1 + 0.04 * Math.sin(t * 7);
    ctx.fillStyle = '#e0322d'; rrect(x, y + 50 * u, w, 100 * u, 24 * u); ctx.fill();
    text('Clic: revelar tu reto :(', x + w / 2, y + 50 * u + 62 * u, 32 * pulse, '#fff', 'center');
  }
}

function drawChallenge() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#3a0610'); g.addColorStop(1, '#14040a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text(chall.kind === 'q' ? 'PREGUNTA SOBRE LA CUMPLEAÑERA' : 'RETO POR SER PERDEDOR :(', W / 2, 120 * u, 56, '#ff9a9a', 'center');
  ctx.font = 'bold ' + Math.round(96 * u) + 'px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  const y = wrap(chall.t, W / 2, 300 * u, W * 0.8, 110 * u);
  const sub = chall.kind === 'q' ? 'Respóndela sin ayuda en ' + chall.secs + ' segundos. Si fallas: ¡SHOT!'
    : chall.shot ? 'Tienes ' + chall.secs + ' segundos. Si no lo cumples: ¡SHOT!' : 'Tienes ' + chall.secs + ' segundos.';
  text(sub, W / 2, y + 30 * u, 40, '#ffd24d', 'center');
  if (cPhase === 'ready') {
    const pulse = 1 + 0.05 * Math.sin(t * 6);
    text('Clic para iniciar el cronómetro', W / 2, 900 * u, 52 * pulse, '#fff', 'center');
  } else if (cPhase === 'run') {
    const low = challT <= 5;
    text(String(Math.ceil(challT)), W / 2, 800 * u, 260, low ? '#ff5a5a' : '#fff', 'center');
    text(chall.kind === 'q' ? 'Clic si acertaste' : 'Clic cuando lo cumplas', W / 2, 960 * u, 40, '#e8dff0', 'center', 'normal');
  } else if (cDone === 'ok') {
    banner(chall.kind === 'q' ? '¡ACERTASTE!' : '¡RETO CUMPLIDO!', W / 2, 760 * u, 130 * u, '#7dff9a', '#064a1c', -0.04);
    text('Clic para continuar', W / 2, 940 * u, 40, '#e8dff0', 'center', 'normal');
  } else {
    banner('¡SE ACABÓ EL TIEMPO!', W / 2, 700 * u, 100 * u, '#ff6b6b', '#4a0606', -0.04);
    text(chall.shot ? '¡A TOMAR EL SHOT!' : '¡FONDO BLANCO YA!', W / 2, 860 * u, 90, '#ffd24d', 'center');
    text('Clic para continuar', W / 2, 980 * u, 36, '#e8dff0', 'center', 'normal');
  }
}

function frame() {
  if (cv.width !== innerWidth || cv.height !== innerHeight) resize();
  const dt = 0.016; t += dt;

  if (st === 'aim') {
    const dx = (held.R ? 1 : 0) - (held.L ? 1 : 0), dy = (held.D ? 1 : 0) - (held.U ? 1 : 0);
    if (dx || dy) holdT += dt; else holdT = 0;
    const sp = 260 + Math.min(holdT, 1.5) * 600, n = Math.hypot(dx, dy) || 1;
    cursor.x = Math.min(IMG_W, Math.max(0, cursor.x + dx / n * sp * dt));
    cursor.y = Math.min(IMG_H, Math.max(0, cursor.y + dy / n * sp * dt));
    const before = Math.ceil(timeLeft); timeLeft -= dt;
    if (timeLeft <= 5 && Math.ceil(timeLeft) !== before) sndTick();
    if (timeLeft <= 0) lose('Se acabó el tiempo.', 'time');
  }
  if (st === 'chall' && cPhase === 'run') {
    const b4 = Math.ceil(challT); challT -= dt;
    if (challT <= 5 && Math.ceil(challT) !== b4) sndTick();
    if (challT <= 0) { challT = 0; cPhase = 'done'; cDone = 'time'; sndBuzz(); }
  }
  if (st === 'reveal' || st === 'lose') {
    revealT += dt;
    if (blend) {
      const p = Math.min(1, revealT / 1.3);
      stepBlend(p);
      if (p >= 1) blend = null;
    }
  }

  ctx.save();
  const shaking = (st === 'reveal' || st === 'lose') && revealT < 0.7;
  if (shaking) { const a = 14 * u * (1 - revealT / 0.7); ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a); }
  drawBg(); drawPhoto(); drawLeft(); drawRight();

  if (st === 'aim') drawSyringe(sx(cursor.x), sy(cursor.y), syringeK());
  if (st === 'reveal') {
    if (result.zone) drawSyringe(sx(cursor.x), sy(cursor.y), syringeK());
    if (revealT > 0.15 && revealT < 1.6 && result.zone) {
      const k = Math.min(1, (revealT - 0.15) / 0.2);
      banner('¡TUNEADA!', PX + IMG_W * S / 2, PY + IMG_H * S * 0.12,
             Math.min((70 + 40 * k) * u, IMG_W * S * 0.17), '#ffe14d', '#7a0030', -0.12);
    }
  }
  if (st === 'lose') {
    ctx.save(); rrect(PX, PY, IMG_W * S, IMG_H * S, 12 * u); ctx.clip();
    ctx.fillStyle = 'rgba(255,30,30,' + (0.35 * Math.min(1, revealT / 0.3)) + ')'; ctx.fillRect(PX, PY, IMG_W * S, IMG_H * S);
    ctx.restore();
    const k = Math.min(1, revealT / 0.25);
    banner('UY,', PX + IMG_W * S / 2, PY + IMG_H * S * 0.42, Math.min(IMG_W * S * 0.28, 150 * u) * k, '#fff', '#7a0000', -0.1);
    const out = loseWhy !== 'time';
    banner(out ? 'PERDISTEEEE' : 'PERDISTE', PX + IMG_W * S / 2, PY + IMG_H * S * 0.55,
           Math.min(IMG_W * S * (out ? 0.15 : 0.22), (out ? 85 : 120) * u) * k, '#ff4d4d', '#fff', -0.1);
  }
  ctx.restore();

  if (st === 'chall') drawChallenge();
  if (st === 'loading') {
    ctx.fillStyle = 'rgba(10,0,20,0.8)'; ctx.fillRect(0, 0, W, H);
    text('Cargando...', W / 2, H / 2, 70, '#ff7ac0', 'center');
  } else if (st === 'home') {
    ctx.fillStyle = 'rgba(10,0,20,0.78)'; ctx.fillRect(0, 0, W, H);
    text('PONLE BOTOX A SHEI', W / 2, 250 * u, 100, '#ff7ac0', 'center');
    text('Feliz cumpleaños', W / 2, 330 * u, 50, '#ffd24d', 'center');
    const pulse = 1 + 0.06 * Math.sin(t * 5);
    banner('READY?', W / 2, 600 * u, 230 * u * pulse, '#fff', '#ff2d8a', 0);
    text('Tápale los ojos a quien juegue. Al hacer clic empieza el tiempo.', W / 2, 760 * u, 38, '#e8dff0', 'center', 'normal');
    text('Haz clic en cualquier parte', W / 2, 840 * u, 44, '#ff7ac0', 'center');
  }
  if (st !== 'loading') drawRestart();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
