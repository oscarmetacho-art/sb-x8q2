// ---------- Sonido (WAV generado, como en el juego del botox) ----------
const NOTES = {
  pop:   [[700, 120, 0.25, 'triangle', 0.5, 0]],
  win:   [523, 659, 784, 1047].map((f, i) => [f, f, 0.18, 'square', 0.25, i * 0.12]),
  ding:  [[880, 880, 0.1, 'square', 0.25, 0], [1320, 1320, 0.22, 'square', 0.25, 0.1]],
  skip:  [[520, 240, 0.2, 'triangle', 0.35, 0]],
  tick:  [[900, 900, 0.05, 'square', 0.15, 0]],
  start: [[440, 440, 0.12, 'square', 0.25, 0], [880, 880, 0.25, 'square', 0.25, 0.14]],
  buzz:  [[150, 80, 0.7, 'sawtooth', 0.45, 0], [150, 80, 0.7, 'square', 0.25, 0.8]],
  fanfare: [523, 523, 523, 659, 784, 659, 784, 1047].map((f, i) => [f, f, 0.2, 'square', 0.25, i * 0.16]),
};
const wavUrls = {};
function makeWav(notes) {
  const SR = 22050;
  const total = Math.max(...notes.map(n => n[5] + n[2])) + 0.05;
  const N = Math.ceil(total * SR), mix = new Float32Array(N);
  notes.forEach(([f1, f2, dur, type, vol, delay]) => {
    let ph = 0;
    for (let i = 0; i < N; i++) {
      const tt = i / SR - delay; if (tt < 0 || tt > dur) continue;
      const f = f1 * Math.pow(f2 / f1, tt / dur);
      ph += 2 * Math.PI * f / SR;
      const c = ph % (2 * Math.PI), x = c / (2 * Math.PI);
      const w = type === 'square' ? (c < Math.PI ? 1 : -1) : type === 'sawtooth' ? 2 * x - 1
              : type === 'triangle' ? 4 * Math.abs(x - 0.5) - 1 : Math.sin(c);
      mix[i] += w * vol * Math.pow(0.0001 / vol, tt / dur);
    }
  });
  const buf = new ArrayBuffer(44 + N * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + N * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, N * 2, true);
  for (let i = 0; i < N; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, mix[i])) * 32767, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
for (const k in NOTES) wavUrls[k] = makeWav(NOTES[k]);
function play(name) {
  try { if (!wavUrls[name]) return; const a = new Audio(wavUrls[name]); a.volume = 1; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
}

// ---------- Azar sin repetir ----------
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
let factDeck = [], lastFact = null;
function nextFact() {
  if (!factDeck.length) { factDeck = shuffle(FACTS.slice()); if (factDeck[factDeck.length - 1] === lastFact) factDeck.unshift(factDeck.pop()); }
  return lastFact = factDeck.pop();
}

// ---------- Imágenes de Shei ----------
const imgs = [new Image(), new Image()], sprites = [null, null];
const SPW = 300;
imgs.forEach((im, i) => {
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = SPW; c.height = Math.round(SPW * im.height / im.width);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); sprites[i] = c;
  };
  im.src = 'img/shei' + (i + 1) + '.png';
});
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
function sheiAt(idx, x, y, w, rot, alpha, shine) {
  const sp = sprites[idx]; if (!sp) return;
  const h = w * sp.height / sp.width;
  let src = sp;
  if (shine !== undefined) {                       // franja de reflejo que cruza la imagen
    tmp.width = sp.width; tmp.height = sp.height;
    tctx.drawImage(sp, 0, 0);
    tctx.globalCompositeOperation = 'source-atop';
    const p = shine * (sp.width + sp.height * 0.6) - sp.height * 0.3;
    const g = tctx.createLinearGradient(p - 38, 0, p + 38, 26);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    tctx.fillStyle = g; tctx.fillRect(0, 0, sp.width, sp.height);
    tctx.globalCompositeOperation = 'source-over';
    src = tmp;
  }
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(src, -w / 2, -h / 2, w, h); ctx.restore();
}
const heads = [];
for (let i = 0; i < 12; i++) heads.push({
  img: i % 2, x: rnd(VW), y: rnd(VH), vx: (rnd(80) + 25) * (rnd(2) ? 1 : -1), vy: (rnd(60) + 20) * (rnd(2) ? 1 : -1),
  base: 190 + rnd(120), ph: rnd(628) / 100, sp: 0.8 + rnd(100) / 80, rs: 0.5 + rnd(100) / 100, sh: rnd(100) / 100,
});
function updateHeads(dt) {
  heads.forEach(h => {
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (h.x < 60 || h.x > VW - 60) h.vx = -h.vx;
    if (h.y < 60 || h.y > VH - 60) h.vy = -h.vy;
  });
}
function drawHeads(count, alpha) {
  for (let i = 0; i < count; i++) {
    const h = heads[i];
    const w = h.base * (0.82 + 0.22 * Math.sin(t * h.sp + h.ph));
    sheiAt(h.img, h.x, h.y, w, Math.sin(t * h.rs + h.ph) * 0.35, alpha, ((t * 0.28 + h.sh) % 1.6) / 1.6);
  }
}

// ---------- Estado ----------
let t = 0, now = 0, lastKeyOk = -1e9, lockUntil = 0;
let scr = 'title', scrT = 0, selId = null, btns = [];
let nPairs = 12, rounds = 1;
let pairs = [], curIdx = -1, queue = [], turnNo = 0, totalTurns = 0;
let catOn = CATS.map(() => true);
let wordDeck = [], usedWords = new Set(), word = null, turnPts = 0, tStart = 0, lastSec = 99;
let factNext = null, factDur = 4.5, factText = '', tickFact = '', tickBase = 0;
let flash = { col: null, t: -9 }, revealSnd = false, lastRollIdx = -1;
const DEF = { title: 'play', pairs: 'confirm', names: 'done', cats: 'start', intro: 'ready', play: 'ok', end: 'next', final: 'again' };

function go(name) { scr = name; scrT = 0; selId = DEF[name] || null; lockUntil = performance.now() + 350; revealSnd = false; }
function startFact(next, dur) { factNext = next; factDur = dur || 4.5; factText = nextFact(); go('fact'); }
function drawNames() {
  pairs = shuffle(PAIR_NAMES.slice()).slice(0, nPairs).map(n => ({ name: n, score: 0 }));
}
function nextWord() {
  if (!wordDeck.length) {
    let pool = [];
    CATS.forEach((c, ci) => { if (catOn[ci]) c.words.forEach(w => { if (!usedWords.has(w)) pool.push({ w, cat: ci }); }); });
    if (!pool.length) { usedWords.clear(); CATS.forEach((c, ci) => { if (catOn[ci]) c.words.forEach(w => pool.push({ w, cat: ci })); }); }
    wordDeck = shuffle(pool);
  }
  const it = wordDeck.pop(); usedWords.add(it.w); return it;
}
function buildQueue() {
  queue = []; let last = -1;
  for (let r = 0; r < rounds; r++) {
    const o = shuffle(pairs.map((p, i) => i));
    if (o[0] === last && o.length > 1) o.push(o.shift());
    queue.push(...o); last = o[o.length - 1];
  }
  totalTurns = queue.length; turnNo = 0;
}
function startGame() {
  pairs.forEach(p => p.score = 0); wordDeck = [];
  buildQueue(); curIdx = queue[0]; startFact('intro', 4);
}
function beginTurn() {
  word = nextWord(); turnPts = 0; tStart = performance.now(); lastSec = 99; go('play'); play('start');
}
function endTurn() {
  play('buzz'); go('end'); lockUntil = performance.now() + 1100;
  if (turnPts > 0) burst(VW * 0.36, 400, 70);
}
function afterTurn() {
  turnNo++;
  if (turnNo >= totalTurns) { go('final'); play('fanfare'); burst(VW * 0.36, 300, 160); return; }
  curIdx = queue[turnNo];
  if (rnd(100) < 65) startFact('intro', 3.5); else go('intro');
}

// ---------- Confeti ----------
let conf = [];
function burst(x, y, n) {
  for (let i = 0; i < n; i++) conf.push({ x, y, vx: (rnd(1400) - 700), vy: -(rnd(900) + 200), r: rnd(628) / 100, vr: rnd(20) - 10,
    c: [C.gold, C.pink, C.mint, C.lav, C.gold2, C.peach][rnd(6)], s: 10 + rnd(14), life: 3 + rnd(200) / 100 });
}
function updateConf(dt) {
  conf.forEach(p => { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.995; p.r += p.vr * dt; p.life -= dt; });
  conf = conf.filter(p => p.life > 0 && p.y < VH + 40);
}
function drawConf() {
  conf.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
}

// ---------- Helpers de dibujo ----------
function setFont(sz, fam, w) { ctx.font = (w || '700') + ' ' + Math.round(sz) + 'px ' + fam; }
const ACC = /[ÁÉÍÓÚ]/;
function T(str, x, y, sz, fam, col, al, w) {
  if (fam === PIX && ACC.test(str)) { fam = SOFT; sz *= 1.15; }
  setFont(sz, fam, fam === PIX ? '400' : w); ctx.fillStyle = col; ctx.textAlign = al || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
}
function fitSize(str, maxW, sz, fam, min) {
  if (fam === PIX && ACC.test(str)) { fam = SOFT; sz *= 1.15; }
  setFont(sz, fam, fam === PIX ? '400' : '700');
  while (sz > (min || 14) && ctx.measureText(str).width > maxW) { sz -= 2; setFont(sz, fam, fam === PIX ? '400' : '700'); }
  return sz;
}
function lines(str, maxW) {
  const out = []; let l = '';
  for (const w of str.split(' ')) { const tt = l ? l + ' ' + w : w; if (ctx.measureText(tt).width > maxW && l) { out.push(l); l = w; } else l = tt; }
  if (l) out.push(l); return out;
}
function para(str, cx, cy, maxW, szMax, szMin, maxLines, fam, col) {
  let sz = szMax, ls;
  for (;;) { setFont(sz, fam); ls = lines(str, maxW); if (ls.length <= maxLines || sz <= szMin) break; sz -= 4; }
  const lh = sz * 1.18, y0 = cy - (ls.length - 1) * lh / 2;
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ls.forEach((l, i) => ctx.fillText(l, cx, y0 + i * lh));
}
function pxpath(x, y, w, h, n) {
  ctx.beginPath(); ctx.moveTo(x + n, y); ctx.lineTo(x + w - n, y); ctx.lineTo(x + w - n, y + n); ctx.lineTo(x + w, y + n);
  ctx.lineTo(x + w, y + h - n); ctx.lineTo(x + w - n, y + h - n); ctx.lineTo(x + w - n, y + h); ctx.lineTo(x + n, y + h);
  ctx.lineTo(x + n, y + h - n); ctx.lineTo(x, y + h - n); ctx.lineTo(x, y + n); ctx.lineTo(x + n, y + n); ctx.closePath();
}
function box(x, y, w, h, fill, o) {
  o = o || {}; const n = o.n || 10, sh = o.sh === undefined ? 10 : o.sh;
  if (sh) { ctx.fillStyle = 'rgba(90,70,50,0.28)'; pxpath(x + sh, y + sh, w, h, n); ctx.fill(); }
  ctx.fillStyle = fill; pxpath(x, y, w, h, n); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(x + n, y + 6, w - 2 * n, 8);
  ctx.lineWidth = o.bw || 8; ctx.strokeStyle = o.border || C.ink; ctx.lineJoin = 'miter'; pxpath(x, y, w, h, n); ctx.stroke();
}
function btn(id, x, y, w, h, label, o) {
  o = o || {}; btns.push({ id, x, y, w, h });
  const sel = selId === id, p = sel ? 6 + Math.sin(t * 8) * 4 : 0;
  box(x - p, y - p, w + 2 * p, h + 2 * p, o.fill || C.gold2, { border: sel ? C.gold : C.ink, bw: sel ? 12 : 8, sh: sel ? 14 : 10 });
  if (sel) { ctx.lineWidth = 4; ctx.strokeStyle = C.ink; pxpath(x - p - 10, y - p - 10, w + 2 * p + 20, h + 2 * p + 20, 12); ctx.stroke(); }
  const cy = y + h / 2 - (o.sub ? h * 0.09 : 0);
  const sz = fitSize(label, w - 50, o.size || 64, o.fam || SOFT);
  T(label, x + w / 2, cy, sz, o.fam || SOFT, o.color || C.ink);
  if (o.sub) T(o.sub, x + w / 2, y + h * 0.78, Math.min(o.subSize || 34, h * 0.2), SOFT, C.ink);
}

// ---------- Fondo retro ----------
const scan = document.createElement('canvas'); scan.width = 4; scan.height = 4;
{ const s = scan.getContext('2d'); s.fillStyle = 'rgba(90,70,50,0.07)'; s.fillRect(0, 3, 4, 1); }
const stars = []; for (let i = 0; i < 46; i++) stars.push({ x: rnd(VW), y: rnd(VH), ph: rnd(628) / 100, s: 6 + rnd(3) * 4 });
function drawBg() {
  ctx.fillStyle = C.bg; ctx.fillRect(-OX / SC, -OY / SC, cv.width / SC, cv.height / SC);
  const sz = 80, off = (t * 18) % (sz * 2);
  ctx.fillStyle = C.bg2;
  for (let y = -sz; y < VH + sz; y += sz) for (let x = -sz * 2; x < VW + sz; x += sz * 2) {
    const row = Math.round(y / sz) & 1; ctx.fillRect(x + off + (row ? sz : 0), y, sz, sz);
  }
  stars.forEach(s => {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.5 + s.ph)); ctx.fillStyle = 'rgba(201,162,75,' + a.toFixed(2) + ')';
    ctx.fillRect(s.x - s.s / 2, s.y - 2, s.s, 4); ctx.fillRect(s.x - 2, s.y - s.s / 2, 4, s.s);
  });
}
function drawScan() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = ctx.createPattern(scan, 'repeat'); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
}

// ---------- Tabla de clasificación ----------

}

function sNames() {

  else if (!revealSnd) { revealSnd = true; play('win'); }

  T('Tienen ' + TURN_SECONDS + ' segundos: ¡entre más adivinen, mejor!', 700, 750, 34, SOFT, C.ink);

function sPlay() {
  drawHeads(3, 0.12);
  const left = Math.max(0, TURN_SECONDS - (performance.now() - tStart) / 1000), secs = Math.ceil(left);
  if (secs !== lastSec) { lastSec = secs; if (secs <= 10 && secs > 0) play('tick'); }
  if (left <= 0) { endTurn(); return; }
  const low = left <= 10, pulse = low ? 1 + Math.sin(t * 12) * 0.06 : 1;
  const fl = Math.max(0, 1 - (t - flash.t) / 0.35);

  T('Aciertos: ' + turnPts, 40, 120, 38, SOFT, C.gold, 'left');
  ctx.save(); ctx.translate(1150, 100); ctx.scale(pulse, pulse);
  T(String(secs), 0, 0, 160, SOFT, low ? '#D9695F' : C.ink); ctx.restore();
  box(40, 190, 1340, 34, C.white, { sh: 4, bw: 5, n: 5 });
  ctx.fillStyle = low ? C.red : C.green; ctx.fillRect(48, 198, 1324 * (left / TURN_SECONDS), 18);
  // palabra
  const wc = catColor(word.cat);
  box(40, 250, 1340, 310, flash.col && fl > 0 ? flash.col : C.white, { sh: 10, bw: 8 });
  setFont(28, SOFT); const chipW = ctx.measureText(CATS[word.cat].name).width + 50;
  box(60, 232, chipW, 50, wc, { sh: 0, bw: 5, n: 5 });
  T(CATS[word.cat].name, 85, 258, 28, SOFT, C.ink, 'left');
  para(word.w, 710, 420, 1240, 112, 56, 3, SOFT, C.ink);
  btn('ok', 40, 600, 660, 440, 'VÁLIDA - PASO', { fill: C.green, size: 76, sub: '+1 punto · siguiente palabra', subSize: 36 });
  btn('skip', 720, 600, 660, 440, 'SALTAR', { fill: C.red, size: 90, sub: 'sin punto · otra palabra', subSize: 36 });

}
function sEnd() {
  drawHeads(4, 0.35);
  sheiAt(0, 240, 720, 360, Math.sin(t * 2) * 0.12, 1, ((t * 0.3) % 1.4) / 1.4);
  sheiAt(1, 1140, 720, 360, -Math.sin(t * 2) * 0.12, 1, ((t * 0.3 + 0.5) % 1.4) / 1.4);
  T('¡SE ACABÓ EL TIEMPO!', 700, 90, fitSize('¡SE ACABÓ EL TIEMPO!', 1300, 48, PIX), PIX, C.gold);
  T(pairs[curIdx].name, 700, 200, fitSize(pairs[curIdx].name, 1300, 90, SOFT, 36), SOFT, C.ink);
  const pop = 1 + Math.sin(Math.min(scrT, 1) * 9) * 0.12 * Math.max(0, 1 - scrT);
  ctx.save(); ctx.translate(700, 450); ctx.scale(pop, pop);
  box(-300, -170, 600, 340, C.white, { sh: 12 });
  T('+' + turnPts, 0, -20, 190, SOFT, turnPts ? '#4E9E6B' : C.ink);
  T(turnPts === 1 ? 'acierto' : 'aciertos', 0, 110, 44, SOFT, C.ink); ctx.restore();
  T('Total: ' + pairs[curIdx].score + ' puntos', 700, 700, 52, SOFT, C.ink);
  btn('next', 190, 870, 1020, 160, turnNo + 1 >= totalTurns ? 'VER RESULTADOS' : 'SIGUIENTE PAREJA', { fill: C.green, size: 70 });

}
function sFinal() {
  drawHeads(6, 0.5);
  const max = Math.max(...pairs.map(p => p.score)), win = pairs.filter(p => p.score === max);
  const nm = win.map(p => p.name).join(' & ');
  T(win.length > 1 ? '¡EMPATE!' : '¡PAREJA GANADORA!', 700, 110, 52, PIX, C.gold);
  const pulse = 1 + Math.sin(t * 5) * 0.03;
  ctx.save(); ctx.translate(700, 380); ctx.scale(pulse, pulse);
  box(-640, -150, 1280, 300, C.gold2, { sh: 16, bw: 10 });
  para(nm, 0, -10, 1180, 120, 40, 2, SOFT, C.ink); ctx.restore();
  T(max + ' puntos', 700, 600, 70, SOFT, C.ink);
  sheiAt(0, 240, 800, 330, Math.sin(t * 2) * 0.12, 1, ((t * 0.3) % 1.4) / 1.4);
  sheiAt(1, 1160, 800, 330, -Math.sin(t * 2) * 0.12, 1, ((t * 0.3 + 0.5) % 1.4) / 1.4);
  btn('again', 360, 880, 680, 150, 'VOLVER A JUGAR', { fill: C.green, size: 64 });
  board();
}

// ---------- Acciones ----------
function act(id) {
  if (performance.now() < lockUntil) return;
  if (scr === 'fact') { if (scrT > 1.5) scrT = factDur; return; }
  switch (id) {
    case 'play': play('start'); startFact('pairs', 4.5); break;
    case 'pm': nPairs = Math.max(2, nPairs - 1); play('tick'); break;
    case 'pp': nPairs = Math.min(PAIR_NAMES.length, nPairs + 1); play('tick'); break;
    case 'rm': rounds = Math.max(1, rounds - 1); play('tick'); break;
    case 'rp': rounds = Math.min(5, rounds + 1); play('tick'); break;
    case 'confirm': drawNames(); tickFact = nextFact(); tickBase = 0; play('pop'); go('names'); break;
    case 'reroll': drawNames(); scrT = 0; tickFact = nextFact(); tickBase = 0; play('pop'); break;
    case 'done': play('start'); go('cats'); break;
    case 'start': if (catOn.some(Boolean)) { play('start'); startGame(); } else play('buzz'); break;
    case 'ready': beginTurn(); break;
    case 'ok':
      turnPts++; pairs[curIdx].score++; play('ding'); flash = { col: C.mint, t }; word = nextWord(); break;
    case 'skip': play('skip'); flash = { col: C.red, t }; word = nextWord(); break;
    case 'next': play('pop'); afterTurn(); break;
    case 'again': play('start'); conf = []; go('pairs'); break;
    default:
      if (id && id.indexOf('cat') === 0) { const i = +id.slice(3); if (!(catOn[i] && catOn.filter(Boolean).length === 1)) catOn[i] = !catOn[i]; play('tick'); }
  }
}

// ---------- Entrada ----------
function keyOf(e) {
  const c = e.keyCode, k = e.key;
  if (k === 'ArrowLeft' || c === 37 || c === 21) return 'L';
  if (k === 'ArrowUp' || c === 38 || c === 19) return 'U';
  if (k === 'ArrowRight' || c === 39 || c === 22) return 'R';
  if (k === 'ArrowDown' || c === 40 || c === 20) return 'D';
  if (k === 'Enter' || k === ' ' || c === 13 || c === 23 || c === 66 || c === 32) return 'OK';
  return null;
}
function navigate(dir) {
  if (!btns.length) return;
  const cur = btns.find(b => b.id === selId);
  if (!cur) { selId = btns[0].id; return; }
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2; let best = null, bs = 1e9;
  btns.forEach(b => {
    if (b === cur) return;
    const dx = b.x + b.w / 2 - cx, dy = b.y + b.h / 2 - cy;
    const along = dir === 'L' ? -dx : dir === 'R' ? dx : dir === 'U' ? -dy : dy;
    if (along <= 5) return;
    const perp = (dir === 'L' || dir === 'R') ? Math.abs(dy) : Math.abs(dx);
    const s = along + perp * 2.5; if (s < bs) { bs = s; best = b; }
  });
  if (best) { selId = best.id; play('tick'); }
}
addEventListener('keydown', e => {
  const k = keyOf(e); if (!k) return; e.preventDefault();
  if (k === 'OK') { if (!e.repeat) { lastKeyOk = performance.now(); if (scr === 'fact') act(null); else if (selId) act(selId); } return; }
  if (!e.repeat || true) navigate(k);
});
function vpt(e) {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (cv.width / r.width), py = (e.clientY - r.top) * (cv.height / r.height);
  return { x: (px - OX) / SC, y: (py - OY) / SC, t: performance.now() };
}
function hit(p) { const s = 8; return btns.find(b => p.x >= b.x - s && p.x <= b.x + b.w + s && p.y >= b.y - s && p.y <= b.y + b.h + s); }
let lastPt = null;
['mousemove', 'pointermove', 'mousedown', 'pointerdown', 'mouseover'].forEach(n => cv.addEventListener(n, e => {
  const p = vpt(e); lastPt = p; const b = hit(p); if (b) selId = b.id;
}));
cv.addEventListener('click', e => {
  if (performance.now() - lastKeyOk < 400) return;
  if (scr === 'fact') { act(null); return; }
  const p = (lastPt && performance.now() - lastPt.t < 1500) ? lastPt : vpt(e);
  let b = hit(p);
  if (!b && btns.length === 1) b = btns[0];          // pantallas con un solo botón: clic en cualquier parte
  if (b) { selId = b.id; act(b.id); }
});

// ---------- Bucle ----------
let prev = performance.now();
function frame() {
  const nw = performance.now(), dt = Math.min(0.05, (nw - prev) / 1000); prev = nw; t += dt; scrT += dt; now = nw / 1000;
  updateHeads(dt); updateConf(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(SC, 0, 0, SC, OX, OY);
  drawBg();
  btns = [];
  ({ title: sTitle, fact: sFact, pairs: sPairs, names: sNames, cats: sCats, intro: sIntro, play: sPlay, end: sEnd, final: sFinal })[scr]();
  drawConf();
  if (!btns.find(b => b.id === selId) && btns.length) selId = btns.find(b => b.id === DEF[scr]) ? DEF[scr] : btns[0].id;
  drawScan();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
